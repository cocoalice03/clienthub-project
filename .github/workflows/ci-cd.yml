name: CI/CD Pipeline ClientHub

on:
  push:
    branches: [ main ]

jobs:
  # Job 1 : Tests Unitaires
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests unitaires
        run: pytest tests/test_unit.py

  # Job 2 : Tests E2E (avec démarrage de l'environnement via Docker Compose)
  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Démarrer l'infrastructure avec Docker Compose
        run: docker compose up --build -d

      - name: Configurer Python pour les tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Attendre que l'API soit prête
        run: |
          echo "Attente du démarrage de l'API..."
          for i in {1..30}; do
            curl -s http://localhost:8022/health && echo "API prête !" && exit 0
            sleep 5
          done
          echo "L'API n'a pas démarré à temps"
          exit 1

      - name: Exécuter les tests E2E
        run: pytest tests/test_e2e.py

      - name: Nettoyer les conteneurs
        if: always()
        run: docker compose down -v

  # Job 3 : Build & Push Docker Hub (Uniquement si Unit et E2E sont OK)
  build-and-push:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construire et pousser l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/clienthub-api:latest

  # Job 4 : Déploiement sur VM Azure via SSH avec mot de passe
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Connexion SSH à la VM Azure et Déploiement
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }} # <-- On utilise le mot de passe ici
          script: |
            # 1. Créer le dossier et s'y positionner
            mkdir -p ~/clienthub-project
            cd ~/clienthub-project

            # 2. Cloner le projet s'il n'existe pas, ou faire un git pull s'il est déjà là
            if [ ! -d ".git" ]; then
              git clone https://github.com/cocoalice03/clienthub-project.git .
            else
              git pull origin main
            fi

            # 3. Lancer le déploiement avec les ports configurés (ex: 8022)
            docker compose pull
            docker compose up -d --force-recreate

            # 4. Vérification finale sur le port correct (8022)
            sleep 5
            curl --fail http://localhost:8022/health